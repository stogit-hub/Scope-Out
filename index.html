// ===========================
// SENSITIVITY SCHEMA
// ===========================

const EMPTY_SENSITIVITIES = {
  sssi: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  spa: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  sac: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  ramsar: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  nationalPark: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  aonb: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  unesco: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  conservationArea: { flag: 'unknown', nearestDistanceM: null, names: [], receptors: [] },
  scheduledMonument: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  ancientWoodland: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  greenBelt: { flag: 'unknown' },
  aqma: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  floodZone3: { flag: 'unknown' },
  floodZone2: { flag: 'unknown' },
  listedBuilding: { flag: 'unknown', nearestDistanceM: null, names: [], receptors: [] },
  nationalNatureReserve: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  localNatureReserve: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  localWildlifeSite: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  agriculturalLand: { flag: 'unknown', grade: null },
  registeredParkGarden: { flag: 'unknown', nearestDistanceKm: null, names: [], receptors: [] },
  publicRightsOfWay: { flag: 'unknown' },
};

// ===========================
// THE PARSER (zero tokens — pure client-side)
// ===========================

const DESIGNATION_LABELS = [
  { label: 'Site of Special Scientific Interest', key: 'sssi', unit: 'km' },
  { label: 'Special Protection Area', key: 'spa', unit: 'km' },
  { label: 'Special Area of Conservation', key: 'sac', unit: 'km' },
  { label: 'Ramsar Wetland Site', key: 'ramsar', unit: 'km' },
  { label: 'National Park', key: 'nationalPark', unit: 'km' },
  { label: 'Area of Outstanding Natural Beauty', key: 'aonb', unit: 'km' },
  { label: 'UNESCO World Heritage Site', key: 'unesco', unit: 'km' },
  { label: 'Conservation Area', key: 'conservationArea', unit: 'm' },
  { label: 'Scheduled Monument', key: 'scheduledMonument', unit: 'km' },
  { label: 'Ancient Woodland', key: 'ancientWoodland', unit: 'km' },
  { label: 'Green Belt', key: 'greenBelt', onSiteOnly: true },
  { label: 'Air Quality Management Area', key: 'aqma', unit: 'km' },
  { label: 'Flood Zone 3 (High Risk)', key: 'floodZone3', onSiteOnly: true },
  { label: 'Flood Zone 2 (Medium Risk)', key: 'floodZone2', onSiteOnly: true },
  { label: 'Listed Building', key: 'listedBuilding', unit: 'm' },
  { label: 'National Nature Reserve', key: 'nationalNatureReserve', unit: 'km' },
  { label: 'Local Nature Reserve', key: 'localNatureReserve', unit: 'km' },
  { label: 'Local Wildlife Site / SINC', key: 'localWildlifeSite', unit: 'km' },
  { label: 'Agricultural Land Classification (Grades 1\u20133)', key: 'agriculturalLand', special: 'agland' },
  { label: 'Registered Park and Garden', key: 'registeredParkGarden', unit: 'km' },
  { label: 'Public Rights of Way', key: 'publicRightsOfWay', special: 'prow' },
];

const SKIP_TOKENS = new Set([
  'Designation', 'Nearest distance', 'Flag', 'Status',
  'Regulation 2(1) Proximity Detail',
  'Additional Environmental Designations Detail',
  'Data Quality Notes',
]);

const BEARINGS = { N: 'north', NE: 'north-east', E: 'east', SE: 'south-east', S: 'south', SW: 'south-west', W: 'west', NW: 'north-west' };

const isDistance = (s) => /^[\d.]+\s*(km|m)$/i.test(s.trim());
const isBearing = (s) => Object.prototype.hasOwnProperty.call(BEARINGS, s.trim().toUpperCase()) && s.trim().length <= 2;
const isIndex = (s) => /^\d+\.$/.test(s.trim());

function parseKm(s) { const m = s.trim().match(/^([\d.]+)\s*(km|m)$/i); if (!m) return null; const v = parseFloat(m[1]); return m[2].toLowerCase() === 'm' ? v / 1000 : v; }
function parseM(s) { const km = parseKm(s); return km == null ? null : Math.round(km * 1000); }
function normDist(s) { return s.replace(/([\d.]+)\s*(km|m)/i, '$1 $2'); }

// Title-case names that arrive entirely in capitals (e.g. NNR / Historic England
// registers), leaving already-mixed-case names like "Epping Forest SSSI" untouched.
function tidyName(n) {
  if (/[a-z]/.test(n) || !/[A-Z]/.test(n)) return n;
  const small = new Set(['of', 'and', 'the', 'on', 'in', 'at', 'to', 'a']);
  return n.toLowerCase().split(/\s+/)
    .map((w, i) => (i > 0 && small.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

function detectFlag(tokens) {
  const j = tokens.join(' | ');
  if (/On site/i.test(j)) return 'on_site';
  if (/Within 1\s*km/i.test(j)) return 'within_1km';
  if (/Within 5\s*km/i.test(j)) return 'within_5km';
  if (/Within search area/i.test(j)) return 'within_search_area';
  if (/Not detected nearby|Not found within/i.test(j)) return 'not_detected';
  if (/Loaded automatically/i.test(j)) return 'unknown';
  return 'unknown';
}

function parseProximityText(text) {
  const rawTokens = text.split(/[\n\t]+/).map(t => t.trim()).filter(Boolean);
  const blocks = {};
  let current = null;
  const labelByToken = (tok) => DESIGNATION_LABELS.find(d => tok === d.label || tok.startsWith(d.label));

  for (const tok of rawTokens) {
    if (SKIP_TOKENS.has(tok)) { if (tok === 'Data Quality Notes') current = null; continue; }
    const match = labelByToken(tok);
    if (match) {
      current = match.key;
      blocks[current] = [];
      const trailing = tok.slice(match.label.length).trim();
      if (trailing) blocks[current].push(trailing);
      continue;
    }
    if (/^[\u26a0\u2139]/.test(tok)) continue; // skip ⚠ / ℹ note lines
    if (current) blocks[current].push(tok);
  }

  const result = JSON.parse(JSON.stringify(EMPTY_SENSITIVITIES));
  let matched = 0;

  for (const def of DESIGNATION_LABELS) {
    const toks = blocks[def.key];
    if (!toks) continue; // not present in paste — leave as 'unknown'
    matched++;
    const flag = detectFlag(toks);

    if (def.special === 'agland') {
      const g = toks.find(t => /Grade\s*\d/i.test(t));
      const grade = g ? (g.match(/Grade\s*\d+[ab]?/i) || [])[0] : null;
      result.agriculturalLand = { flag, grade: grade || null };
      continue;
    }
    if (def.special === 'prow') { result.publicRightsOfWay = { flag }; continue; }
    if (def.onSiteOnly) { result[def.key] = { flag }; continue; }

    const clean = toks.filter(t => !isIndex(t) && !/^Within |^Not detected|^Not found|^On site|^Loaded automatically/i.test(t));
    let nearest = null, i = 0;
    const receptors = [];
    if (clean.length && isDistance(clean[0])) { nearest = clean[0]; i = 1; }
    while (i < clean.length) {
      const name = clean[i], bearing = clean[i + 1], dist = clean[i + 2];
      if (name && bearing && dist && isBearing(bearing) && isDistance(dist) && !isDistance(name)) {
        receptors.push({
          name: tidyName(name), bearing: bearing.toUpperCase(), bearingWord: BEARINGS[bearing.toUpperCase()],
          distanceText: normDist(dist), distanceKm: parseKm(dist),
        });
        i += 3;
      } else { i += 1; }
    }
    if (!nearest && receptors.length) {
      const m = receptors.reduce((a, b) => (a.distanceKm ?? 1e9) < (b.distanceKm ?? 1e9) ? a : b);
      nearest = m.distanceText;
    }
    const entry = { flag, names: receptors.map(r => r.name), receptors };
    if (def.unit === 'm') entry.nearestDistanceM = nearest ? parseM(nearest) : null;
    else entry.nearestDistanceKm = nearest ? parseKm(nearest) : null;
    result[def.key] = entry;
  }

  return { result, matched };
}

// ===========================
// PLACEHOLDER RENDERING
// ===========================

function toCamelCase(snake) {
  const parts = snake.toLowerCase().split('_');
  return parts[0] + parts.slice(1).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
}

function renderPlaceholderText(text, dev) {
  if (!text) return null;
  const parts = [];
  const re = /\{\{([A-Z0-9_]+)\}\}/g;
  let lastIdx = 0, match, i = 0;
  while ((match = re.exec(text)) !== null) {
    if (match.index > lastIdx) parts.push(<span key={`t-${i++}`}>{text.slice(lastIdx, match.index)}</span>);
    const key = match[1];
    const value = dev[toCamelCase(key)];
    if (value && String(value).trim()) {
      parts.push(<span key={`f-${i++}`} className="filled-text">{value}</span>);
    } else {
      parts.push(
        <span key={`p-${i++}`} className="placeholder-pill font-mono" title={`Placeholder: ${key}`}>
          {key.replace(/_/g, ' ').toLowerCase()}
        </span>
      );
    }
    lastIdx = re.lastIndex;
  }
  if (lastIdx < text.length) parts.push(<span key={`t-${i++}`}>{text.slice(lastIdx)}</span>);
  return parts;
}

// ===========================
// RECEPTOR-AWARE TEMPLATE HELPERS
// ===========================

function nearestReceptor(s) {
  if (s && s.receptors && s.receptors.length) {
    return s.receptors.reduce((a, b) => (a.distanceKm ?? 1e9) <= (b.distanceKm ?? 1e9) ? a : b);
  }
  return null;
}

// "Epping Forest SSSI (approximately 1.1 km to the south-east of the Site)"
// Falls back to nearest distance if no named receptors.
function describeNearest(s, designationWord, { skipNumericName = true } = {}) {
  const r = nearestReceptor(s);
  if (r) {
    const named = !(skipNumericName && /^\d+$/.test(r.name));
    return `the nearest ${designationWord}${named ? ` (${r.name})` : ''} lies approximately ${r.distanceText} to the ${r.bearingWord} of the Site`;
  }
  const d = s.nearestDistanceM != null ? `${s.nearestDistanceM} m` : (s.nearestDistanceKm != null ? `${s.nearestDistanceKm} km` : null);
  if (d) return `the nearest ${designationWord} lies approximately ${d} from the Site`;
  return null;
}

function aqBaseline(sens) {
  const a = sens.aqma;
  const r = nearestReceptor(a);
  if (a.flag === 'on_site') {
    return `The Site lies wholly within ${r ? r.name : 'an Air Quality Management Area (AQMA)'}, designated for exceedances of the annual mean nitrogen dioxide (NO₂) objective.`;
  }
  if ((a.flag === 'within_5km' || a.flag === 'within_1km') && r) {
    return `The nearest Air Quality Management Area (${r.name}) lies approximately ${r.distanceText} to the ${r.bearingWord} of the Site; the Site itself is not located within an AQMA.`;
  }
  if (a.flag === 'within_5km' && a.nearestDistanceKm != null) {
    return `The nearest Air Quality Management Area is located approximately ${a.nearestDistanceKm} km from the Site; the Site itself is not located within an AQMA.`;
  }
  return `The Site does not lie within an Air Quality Management Area (AQMA); the nearest AQMA is located beyond 5 km of the Site.`;
}

function ecologicalDesignationsNote(sens) {
  const bits = [];
  const add = (key, word) => {
    const s = sens[key];
    if (s.flag === 'on_site') { bits.push(`the Site lies on or directly adjacent to a ${word}`); return; }
    if (['within_1km', 'within_5km', 'within_search_area'].includes(s.flag)) {
      const d = describeNearest(s, word);
      if (d) bits.push(d);
    }
  };
  add('sssi', 'Site of Special Scientific Interest (SSSI)');
  add('spa', 'Special Protection Area (SPA)');
  add('sac', 'Special Area of Conservation (SAC)');
  add('ramsar', 'Ramsar wetland site');
  add('nationalNatureReserve', 'National Nature Reserve');
  add('localNatureReserve', 'Local Nature Reserve');
  add('localWildlifeSite', 'Local Wildlife Site / SINC');
  if (!bits.length) {
    return 'There are no statutory or non-statutory ecological designations within or adjacent to the Site, and the nearest designated sites lie well beyond the typical zone of influence for a development of this nature.';
  }
  // Capitalise first letter of the assembled sentence.
  const joined = bits.join('; ');
  return `In terms of ecological designations, ${joined}.`;
}

function conservationAreaNote(sens) {
  const ca = sens.conservationArea;
  if (ca.flag === 'on_site') {
    const r = nearestReceptor(ca);
    return `The Site lies within ${r ? r.name + ' Conservation Area' : 'a Conservation Area'}, the character and appearance of which is a key design consideration.`;
  }
  const d = describeNearest(ca, 'Conservation Area');
  if (ca.flag === 'within_1km' && d) return `For built heritage, ${d}.`;
  return `There are no Conservation Areas in immediate proximity to the Site.`;
}

function listedBuildingNote(sens) {
  const lb = sens.listedBuilding;
  if (lb.flag === 'on_site') return `The Site contains, or directly abuts, a listed building, the setting of which is a primary design consideration.`;
  const r = nearestReceptor(lb);
  if (r) {
    const named = !/^\d+$/.test(r.name);
    const others = (lb.receptors || []).filter(x => x !== r && !/^\d+$/.test(x.name)).slice(0, 2);
    let s = `The nearest listed building${named ? ` (${r.name})` : ''} lies approximately ${r.distanceText} to the ${r.bearingWord} of the Site`;
    if (others.length) s += `, with ${others.map(o => `${o.name} (${o.distanceText} ${o.bearingWord})`).join(' and ')} in the wider setting`;
    return s + '.';
  }
  if (lb.nearestDistanceM != null) return `The nearest listed building lies approximately ${lb.nearestDistanceM} m from the Site.`;
  return `No listed buildings have been identified within 1 km of the Site.`;
}

function scheduledMonumentNote(sens) {
  const sm = sens.scheduledMonument;
  const d = describeNearest(sm, 'Scheduled Monument');
  if (['within_1km', 'within_5km'].includes(sm.flag) && d) return `${d.charAt(0).toUpperCase()}${d.slice(1)}.`;
  return `No Scheduled Monuments have been identified within 5 km of the Site.`;
}

function registeredParkGardenNote(sens) {
  const rpg = sens.registeredParkGarden;
  const d = describeNearest(rpg, 'Registered Park and Garden');
  if (['within_1km', 'within_5km'].includes(rpg.flag) && d) return `${d.charAt(0).toUpperCase()}${d.slice(1)}.`;
  return `No Registered Parks and Gardens have been identified within 5 km of the Site.`;
}

function floodZoneNote(sens) {
  if (sens.floodZone3.flag === 'on_site') return { zone: 'Flood Zone 3 (high probability of fluvial flooding)', risk: 'a high probability of flooding from rivers and the sea; this raises material considerations for the FRA and the application of the Sequential and Exception Tests' };
  if (sens.floodZone2.flag === 'on_site') return { zone: 'Flood Zone 2 (medium probability of fluvial flooding)', risk: 'a medium probability of flooding from rivers and the sea' };
  return { zone: 'Flood Zone 1', risk: 'a low probability of fluvial flooding' };
}

function townscapeContext(sens) {
  const bits = [];
  if (sens.greenBelt.flag === 'on_site') bits.push('the Metropolitan Green Belt');
  const ca = sens.conservationArea;
  if (ca.flag === 'within_1km' || ca.flag === 'on_site') {
    const r = nearestReceptor(ca);
    bits.push(`close proximity to ${r ? r.name + ' Conservation Area' : 'one or more Conservation Areas'}`);
  }
  if (!bits.length) bits.push('an established urban context');
  return bits.join(', and within ');
}

// "a Transport Assessment", "a Transport Assessment and Travel Plan",
// "a Transport Assessment, Travel Plan and Construction Logistics Plan".
// Returns null when no docs — templates use that to switch to "no assessment necessary" wording.
function listDocs(docs) {
  if (!docs) return null;
  const cleaned = docs.map(d => (d || '').trim()).filter(Boolean);
  if (!cleaned.length) return null;
  const article = /^[aeiou]/i.test(cleaned[0]) ? 'an' : 'a';
  if (cleaned.length === 1) return `${article} ${cleaned[0]}`;
  if (cleaned.length === 2) return `${article} ${cleaned[0]} and ${cleaned[1]}`;
  return `${article} ${cleaned.slice(0, -1).join(', ')} and ${cleaned[cleaned.length - 1]}`;
}

function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Helper: pull a development-type-specific phrase from the variants catalogue, falling
// back to the default. Templates use this at the inflection points where typology matters.
function tv(d, key) {
  const variants = TYPE_VARIANTS[key];
  if (!variants) return '';
  return variants[d.developmentType] || variants.default || '';
}

function Section({ title, subtitle, children, defaultOpen = true, action }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="bg-white border border-[#D9D4C7] rounded-sm mb-6 overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-[#FBFAF7] transition-colors border-b" style={{ borderBottomColor: open ? '#E8E4D8' : 'transparent' }}>
        <div className="flex items-center gap-3">
          {open ? <ChevronDown size={16} className="text-[#52605A]" /> : <ChevronRight size={16} className="text-[#52605A]" />}
          <div>
            <h2 className="font-display text-xl text-[#0F1F1A] tracking-tight leading-tight" style={{ fontWeight: 500 }}>{title}</h2>
            {subtitle && <p className="text-sm text-[#52605A] mt-0.5 font-body">{subtitle}</p>}
          </div>
        </div>
        {action && <div onClick={(e) => e.stopPropagation()}>{action}</div>}
      </button>
      {open && <div className="p-5 fade-in">{children}</div>}
    </div>
  );
}

    primary: 'bg-[#1F4A3A] hover:bg-[#163428] text-white border border-[#1F4A3A]',

  };

    <button onClick={onClick} disabled={disabled} className={`${sizes[size]} ${variants[variant]} rounded-sm font-body font-medium tracking-tight inline-flex items-center gap-1.5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed`}>

}

function TopicCard({ topic, sens, dev, docs, customText, onCustomTextChange, scopedIn, onScopedInChange, onResetText }) {
  const [editing, setEditing] = useState(false);
  const generatedText = useMemo(() => topic.template(sens, dev, docs), [topic, sens, dev, docs]);
  const displayText = customText != null ? customText : generatedText;
  const flags = topic.flags(sens);
  const docCount = (docs || []).filter(d => d && d.trim()).length;

  return (
    <div className="bg-white border border-[#D9D4C7] rounded-sm overflow-hidden">
      <div className="px-5 py-3.5 border-b border-[#E8E4D8] flex items-start justify-between gap-3 bg-[#FBFAF7]">

          <div className="flex items-baseline gap-2 flex-wrap">
            <h3 className="font-display text-lg text-[#0F1F1A] leading-tight" style={{ fontWeight: 500 }}>{topic.name}</h3>
            <span className="text-xs font-body text-[#8B8472] italic">{topic.category}</span>
          </div>
          <div className="flex items-center gap-2 mt-1.5 flex-wrap">
            <label className="inline-flex items-center gap-1.5 text-xs font-body text-[#52605A] cursor-pointer">
              <input type="checkbox" checked={!scopedIn} onChange={(e) => onScopedInChange(!e.target.checked)} className="accent-[#1F4A3A]" />
              Scope out
            </label>
            <Badge color={topic.conclusion.toLowerCase().includes('beneficial') ? 'success' : 'neutral'}>{topic.conclusion}</Badge>
            <Badge color={docCount > 0 ? 'success' : 'neutral'}>{docCount === 0 ? 'No supporting docs' : `${docCount} supporting doc${docCount === 1 ? '' : 's'}`}</Badge>
            {customText != null && <Badge color="warn">Edited</Badge>}
            {flags.map((f, i) => (
              <Badge key={i} color={f.level === 'warn' ? 'danger' : 'warn'}><AlertTriangle size={9} className="inline mr-0.5" />{f.text}</Badge>
            ))}
          </div>
        </div>
        <div className="flex items-center gap-1.5 flex-shrink-0">
          {customText != null && <Button size="sm" variant="ghost" icon={RotateCcw} onClick={onResetText}>Reset</Button>}
          <Button size="sm" variant="secondary" icon={editing ? Check : Edit3} onClick={() => setEditing(!editing)}>{editing ? 'Done' : 'Edit'}</Button>
        </div>
      </div>

      {scopedIn && (
        <div className="px-5 py-2.5 bg-[#FCE7E2] border-b border-[#E5A89B] text-xs font-body text-[#8B2D1A] flex items-center gap-2">
          <AlertTriangle size={12} />This topic is scoped IN. The rationale describes residual effects; the assessment will form an ES chapter.
        </div>
      )}

      <div className="p-5">
        {editing ? (
          <textarea value={displayText} onChange={(e) => onCustomTextChange(e.target.value)} rows={10}
            className="w-full px-3 py-2 text-sm font-body text-[#0F1F1A] bg-white border border-[#D9D4C7] rounded-sm focus:outline-none focus:border-[#1F4A3A] focus:ring-1 focus:ring-[#1F4A3A] resize-vertical leading-relaxed editable-area" />
        ) : (
          <div className="rationale-prose font-body">{renderPlaceholderText(displayText, dev)}</div>
        )}
      </div>
    </div>
  );
}

// MAIN APP
// ===========================

function App() {
  const [rawText, setRawText] = useState('');
  const [sensitivities, setSensitivities] = useState(EMPTY_SENSITIVITIES);
  const [dev, setDev] = useState(EMPTY_DEV);
  const [topicDocs, setTopicDocs] = useState(DEFAULT_TOPIC_DOCS);
  const [topicState, setTopicState] = useState({});
  const [copySuccess, setCopySuccess] = useState(false);
  const [downloadSuccess, setDownloadSuccess] = useState(false);
  const [parseMsg, setParseMsg] = useState(null);

  const effectiveDev = useMemo(() => ({ ...dev, developmentTypeLower: dev.developmentType ? dev.developmentType.toLowerCase() : '' }), [dev]);
  const getDocs = (topicId) => (topicDocs[topicId] || []).filter(d => d && d.trim());

  const handleParse = () => {
    if (!rawText.trim()) { setParseMsg({ type: 'err', text: 'Paste the proximity table text first.' }); return; }
    try {
      const { result, matched } = parseProximityText(rawText);
      setSensitivities(result);
      const onSite = Object.values(result).filter(v => v.flag === 'on_site').length;
      const nearby = Object.values(result).filter(v => ['within_1km', 'within_5km', 'within_search_area'].includes(v.flag)).length;
      const none = Object.values(result).filter(v => v.flag === 'not_detected').length;
      setParseMsg({ type: 'ok', text: `Parsed ${matched} designations — ${nearby} nearby, ${onSite} on site, ${none} not detected. Check section 2 and adjust anything that looks off.` });
    } catch (e) {
      setParseMsg({ type: 'err', text: 'Could not parse that text. Make sure you copied the full table including designation labels.' });
    }
  };

  const handleLoadDemo = () => {
    setRawText(DEMO_TEXT);
    const { result } = parseProximityText(DEMO_TEXT);
    setSensitivities(result);
    setDev({
      ...EMPTY_DEV,
      siteName: 'Waltham Abbey — WA/Q251036 (demo)', siteAreaHa: '1.8', ngr: 'TL 38123 00567',
      localAuthority: 'Epping Forest District Council', localPlan: 'Epping Forest District Local Plan (2023)',
      developmentType: 'residential-led mixed-use', keyRoads: 'Sewardstone Road and the A121',
      prevailingWindNote: 'south-westerly winds',
      localWasteMineralsPlan: 'Essex Minerals Local Plan (2014) and Waste Local Plan (2017)',
    });
    // Demo defaults: mid-rise residential-led scheme in a heritage-sensitive setting.
    // Include heritage and daylight assessments; omit CFD (mid-rise) and townscape (covered under heritage HTVIA).
    setTopicDocs({
      ...DEFAULT_TOPIC_DOCS,
      daylight: ['Daylight, Sunlight and Overshadowing Assessment'],
    });
    setParseMsg({ type: 'ok', text: 'Demo loaded and parsed. Named receptors with exact distances and bearings are shown in section 2.' });
  };

  const handleReset = () => {
    if (!window.confirm('Reset all inputs and outputs?')) return;
    setRawText(''); setSensitivities(EMPTY_SENSITIVITIES); setDev(EMPTY_DEV); setTopicDocs(DEFAULT_TOPIC_DOCS); setTopicState({}); setParseMsg(null);
  };

  const updateTopicState = (id, patch) => setTopicState(s => ({ ...s, [id]: { ...s[id], ...patch } }));

  const handleCopyAll = () => {
    const lines = [`# EIA Screening — Scoping Out Table`, ''];
    lines.push(`**Site:** ${effectiveDev.siteName || '[Site name]'}  `);
    lines.push(`**LPA:** ${effectiveDev.localAuthority || '[LPA]'}  `);
    lines.push(`**Development:** ${effectiveDev.developmentDescription || '[Development description]'}`);
    lines.push('', '| Topic | Conclusion | Supporting documents | Rationale |', '| --- | --- | --- | --- |');
    TOPICS.forEach(t => {
      const ts = topicState[t.id] || {};
      const docs = getDocs(t.id);
      const text = ts.customText != null ? ts.customText : t.template(sensitivities, effectiveDev, docs);
      const filled = text.replace(/\{\{([A-Z0-9_]+)\}\}/g, (_, k) => {
        const v = effectiveDev[toCamelCase(k)];
        return v && String(v).trim() ? v : `[${k.replace(/_/g, ' ').toLowerCase()}]`;
      });
      const safe = filled.replace(/\|/g, '\\|').replace(/\n/g, ' ');
      const docCell = docs.length ? docs.join('; ') : '— none —';
      lines.push(`| ${t.name} | ${ts.scopedIn ? 'SCOPED IN' : t.conclusion} | ${docCell} | ${safe} |`);
    });
    navigator.clipboard.writeText(lines.join('\n')).then(() => { setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2000); });
  };

  // Build a complete self-contained HTML report (sensitivities + topic table + supporting docs)
  // that opens in any browser and pastes cleanly into Word with formatting preserved.
  const handleDownloadHTML = () => {
    const escHTML = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const fillText = (text) => text.replace(/\{\{([A-Z0-9_]+)\}\}/g, (_, k) => {
      const v = effectiveDev[toCamelCase(k)];
      return v && String(v).trim() ? escHTML(v) : `<span style="background:#FBE7A1;border:1px solid #E0BB3F;padding:0 4px;border-radius:3px;color:#5A4100;font-family:monospace;font-size:0.9em">${escHTML(k.replace(/_/g, ' ').toLowerCase())}</span>`;
    });

    // Site sensitivities table rows
    const sensRows = [];
    SENS_GROUPS.forEach(group => {
      group.items.forEach(item => {
        const sens = sensitivities[item.key] || {};
        const flagLabel = ({ on_site: 'On site', within_1km: 'Within 1 km', within_5km: 'Within 5 km', within_search_area: 'Within search area', not_detected: 'Not detected', unknown: 'Unknown' })[sens.flag] || 'Unknown';
        const dist = item.distUnit === 'm' ? (sens.nearestDistanceM != null ? `${sens.nearestDistanceM} m` : '—') : (sens.nearestDistanceKm != null ? `${sens.nearestDistanceKm} km` : (item.distUnit ? '—' : ''));
        const grade = item.special === 'agland' && sens.grade ? sens.grade : '';
        const receptors = sens.receptors && sens.receptors.length ? sens.receptors.map(r => `${escHTML(r.name)} · ${escHTML(r.distanceText)} ${r.bearing}`).join('<br>') : '';
        sensRows.push(`<tr><td>${escHTML(item.label)}</td><td>${escHTML(flagLabel)}</td><td>${escHTML(dist || grade)}</td><td>${receptors}</td></tr>`);
      });
    });

    // Topic rows
    const topicRows = TOPICS.map(t => {
      const ts = topicState[t.id] || {};
      const docs = getDocs(t.id);
      const text = ts.customText != null ? ts.customText : t.template(sensitivities, effectiveDev, docs);
      const filled = fillText(text);
      const conclusion = ts.scopedIn ? 'SCOPED IN' : t.conclusion;
      const docList = docs.length ? docs.map(d => `<li>${escHTML(d)}</li>`).join('') : '<em>None</em>';
      return `<tr><td><strong>${escHTML(t.name)}</strong><br><span style="font-size:0.85em;color:#666;font-style:italic">${escHTML(t.category)}</span></td><td>${escHTML(conclusion)}</td><td>${docs.length ? `<ul style="margin:0;padding-left:18px">${docList}</ul>` : `<em style="color:#999">— none —</em>`}</td><td style="line-height:1.55">${filled}</td></tr>`;
    }).join('');

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EIA Screening — ${escHTML(effectiveDev.siteName || 'Scoping Out Table')}</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 1100px; margin: 32px auto; padding: 0 24px; color: #1f2d26; line-height: 1.55; }
  h1 { font-size: 26px; margin-bottom: 8px; color: #0F1F1A; font-weight: 500; }
  h2 { font-size: 18px; margin-top: 28px; margin-bottom: 10px; color: #0F1F1A; font-weight: 500; border-bottom: 1px solid #D9D4C7; padding-bottom: 4px; }
  .meta { font-size: 13px; color: #555; margin-bottom: 16px; }
  .meta strong { color: #0F1F1A; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 28px; font-size: 12.5px; font-family: -apple-system, sans-serif; }
  th, td { border: 1px solid #c7bfab; padding: 8px 10px; vertical-align: top; text-align: left; }
  th { background: #F1EDE4; font-weight: 600; color: #0F1F1A; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid #D9D4C7; font-size: 11px; color: #666; font-style: italic; }
</style>
</head>
<body>
  <h1>EIA Screening — Scoping Out Table</h1>
  <div class="meta">
    <strong>Site:</strong> ${escHTML(effectiveDev.siteName || '[Site name]')}<br>
    <strong>LPA:</strong> ${escHTML(effectiveDev.localAuthority || '[LPA]')}<br>
    <strong>Development:</strong> ${escHTML(effectiveDev.developmentDescription || '[Development description]')}<br>
    <strong>Generated:</strong> ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}
  </div>

  <h2>Site sensitivities</h2>
  <table>
    <thead><tr><th>Designation</th><th>Status</th><th>Nearest distance</th><th>Named receptors</th></tr></thead>
    <tbody>${sensRows.join('')}</tbody>
  </table>

  <h2>Scoping-out table</h2>
  <table>
    <thead><tr><th style="width:22%">Topic</th><th style="width:13%">Conclusion</th><th style="width:18%">Supporting documents</th><th>Rationale</th></tr></thead>
    <tbody>${topicRows}</tbody>
  </table>

  <div class="footer">
    Generated using the EIA Screening Generator. All output is a starting point — the EIA practitioner remains responsible for confirming conclusions, particularly where on-site sensitivities are flagged. Yellow-highlighted placeholders indicate fields not yet filled in.
  </div>
</body>
</html>`;

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (effectiveDev.siteName || 'eia-screening').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
    a.href = url; a.download = `${safeName || 'eia-screening'}-${new Date().toISOString().slice(0, 10)}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDownloadSuccess(true); setTimeout(() => setDownloadSuccess(false), 2000);
  };

  const placeholderCount = useMemo(() => {
    let count = 0;
    TOPICS.forEach(t => {
      const ts = topicState[t.id] || {};
      const docs = getDocs(t.id);
      const text = ts.customText != null ? ts.customText : t.template(sensitivities, effectiveDev, docs);
      (text.match(/\{\{([A-Z0-9_]+)\}\}/g) || []).forEach(m => {
        const dk = toCamelCase(m.slice(2, -2));
        if (!effectiveDev[dk] || !String(effectiveDev[dk]).trim()) count++;
      });
    });
    return count;
  }, [topicState, sensitivities, effectiveDev, topicDocs]);

  return (
    <>
      <div className="min-h-screen font-body" style={{ background: '#F5F2EC', color: '#0F1F1A' }}>
        <header className="border-b border-[#D9D4C7] bg-[#FBFAF7]">
          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex items-baseline justify-between flex-wrap gap-3">
              <div>
                <div className="text-xs font-body uppercase tracking-widest text-[#52605A] mb-1" style={{ letterSpacing: '0.15em' }}>EIA Screening Generator</div>
                <h1 className="font-display text-4xl text-[#0F1F1A] tracking-tight leading-tight" style={{ fontWeight: 400 }}>
                  Scoping out rationale, <em className="italic" style={{ fontWeight: 300 }}>drafted from your inputs</em>
                </h1>
                <p className="text-sm text-[#52605A] mt-2 max-w-2xl font-body leading-relaxed">
                  Paste the proximity-table text from your screening tool, then fill in known project details. Unknown supporting information stays visible as <span className="placeholder-pill font-mono text-xs">yellow placeholders</span> until filled in.
                </p>
              </div>
              <div className="flex flex-col items-end gap-2">
                <Button onClick={handleLoadDemo} variant="ghost" icon={ListChecks} size="sm">Load Waltham Abbey demo</Button>
                <Button onClick={handleReset} variant="ghost" icon={RotateCcw} size="sm">Reset all</Button>
              </div>
            </div>
          </div>
        </header>

        <main className="max-w-7xl mx-auto px-6 py-8">
          <Section title="1. Paste proximity text" subtitle="Copy the full output from your screening tool (both the Regulation 2(1) and Additional Designations sections) and paste here."
            defaultOpen={!Object.values(sensitivities).some(v => v.flag && v.flag !== 'unknown')}
            action={<Button onClick={handleParse} variant="primary" icon={FileSearch}>Parse text</Button>}>
            <textarea value={rawText} onChange={(e) => setRawText(e.target.value)}
              placeholder="Paste here — e.g.&#10;Regulation 2(1) Proximity Detail&#10;Site of Special Scientific Interest&#10;1.07 km&#10;1.&#10;Epping Forest SSSI&#10;SE&#10;1.1km&#10;…"
              rows={8}
              className="w-full px-3 py-2.5 text-sm font-mono text-[#0F1F1A] bg-white border border-[#D9D4C7] rounded-sm focus:outline-none focus:border-[#1F4A3A] focus:ring-1 focus:ring-[#1F4A3A] placeholder:text-[#B8B0A0] resize-vertical leading-relaxed" />
            {parseMsg && (
              <div className={`mt-3 px-3 py-2 rounded-sm text-sm font-body flex items-start gap-2 border ${parseMsg.type === 'ok' ? 'bg-[#E8EDE8] border-[#9FB5A4] text-[#2F4A3A]' : 'bg-[#FCE7E2] border-[#E5A89B] text-[#8B2D1A]'}`}>
                {parseMsg.type === 'ok' ? <Check size={14} className="mt-0.5 flex-shrink-0" /> : <AlertTriangle size={14} className="mt-0.5 flex-shrink-0" />}
                <div>{parseMsg.text}</div>
              </div>
            )}
            <div className="mt-4 px-3 py-2.5 bg-[#FBFAF7] border border-[#E8E4D8] rounded-sm text-xs font-body text-[#52605A] flex items-start gap-2">
              <Info size={12} className="flex-shrink-0 mt-0.5" />
              <div>The parser captures each designation's flag, nearest distance, and every named receptor with its individual distance and bearing — these exact distances flow into the rationale text (e.g. "the nearest SSSI (Epping Forest SSSI) lies approximately 1.1 km to the south-east"). Flood zones come through as "unknown" since they load from the EA WMS layer, not the table — set them manually in section 2.</div>
            </div>
          </Section>

          <Section title="2. Site sensitivities" subtitle="Edit anything the parser got wrong, or fill in manually. The rationale reacts live to these flags and receptor distances." defaultOpen={true}>
            <SensitivitiesEditor sensitivities={sensitivities} onChange={setSensitivities} />
          </Section>

          <Section title="3. Development details" subtitle={`Anything left blank shows as a yellow placeholder. Currently ${placeholderCount} placeholder${placeholderCount === 1 ? '' : 's'} unfilled.`} defaultOpen={false}>
            <DevDetailsForm dev={dev} onChange={setDev} />
          </Section>

          <Section title="4. Supporting documents by topic" subtitle="Each topic lists the documents that will accompany the planning application. Leave a topic empty if no specialist assessment is being submitted — the rationale will read 'no formal assessment is considered necessary'." defaultOpen={false}>
            <TopicDocsEditor topicDocs={topicDocs} onChange={setTopicDocs} />
          </Section>

          <div className="flex items-baseline justify-between mb-4 mt-10 flex-wrap gap-3">
            <div>
              <div className="text-xs font-body uppercase tracking-widest text-[#52605A]" style={{ letterSpacing: '0.15em' }}>Output</div>
              <h2 className="font-display text-3xl text-[#0F1F1A] tracking-tight" style={{ fontWeight: 400 }}>Scoping-out table</h2>
            </div>
            <div className="flex items-center gap-2">
              <Button onClick={handleDownloadHTML} variant="secondary" icon={downloadSuccess ? Check : Download}>{downloadSuccess ? 'Downloaded' : 'Download HTML'}</Button>
              <Button onClick={handleCopyAll} variant="primary" icon={copySuccess ? Check : Copy}>{copySuccess ? 'Copied' : 'Copy table (Markdown)'}</Button>
            </div>
          </div>

          <div className="space-y-4">
            {TOPICS.map(topic => {
              const ts = topicState[topic.id] || {};
              return (
                <TopicCard key={topic.id} topic={topic} sens={sensitivities} dev={effectiveDev} docs={getDocs(topic.id)}
                  customText={ts.customText} onCustomTextChange={(t) => updateTopicState(topic.id, { customText: t })}
                  scopedIn={!!ts.scopedIn} onScopedInChange={(v) => updateTopicState(topic.id, { scopedIn: v })}
                  onResetText={() => updateTopicState(topic.id, { customText: null })} />
              );
            })}
          </div>

          <div className="mt-10">
            <div className="mb-4">
              <div className="text-xs font-body uppercase tracking-widest text-[#52605A]" style={{ letterSpacing: '0.15em' }}>Consolidated view</div>
              <h2 className="font-display text-3xl text-[#0F1F1A] tracking-tight" style={{ fontWeight: 400 }}>All sections as a table</h2>
              <p className="text-sm text-[#52605A] mt-2 max-w-2xl font-body leading-relaxed">A single-table view of everything above — for scrolling review, screenshotting, or selecting and copying directly from the page. Use Download HTML for a self-contained file you can open in a browser or paste into Word.</p>
            </div>
            <ConsolidatedTable topics={TOPICS} sensitivities={sensitivities} dev={effectiveDev} topicState={topicState} getDocs={getDocs} />
          </div>

          <div className="mt-12 pt-6 border-t border-[#D9D4C7] text-xs font-body text-[#52605A] leading-relaxed max-w-3xl">
            <p className="mb-2"><span className="font-semibold text-[#0F1F1A]">A note on use:</span> this generator drafts screening-style rationale (the argument that a topic does not warrant assessment within an ES). All output is a starting point — the EIA practitioner remains responsible for confirming conclusions, particularly where on-site sensitivities are flagged. Everything runs locally in your browser; no data leaves the page and no tokens are used.</p>
            <p><span className="font-semibold text-[#0F1F1A]">Placeholders</span> remain visible as yellow pills. Fill a Development Details field and every matching placeholder across the table updates live. The Copy and Download buttons convert unfilled placeholders to <span className="font-mono">[bracketed]</span> markers (Markdown) or keep them as visible yellow pills (HTML).</p>
          </div>
        </main>
      </div>
    </>
  );
}

// ===========================
// CONSOLIDATED TABLE
// ===========================

function ConsolidatedTable({ topics, sensitivities, dev, topicState, getDocs }) {
  return (
    <div className="bg-white border border-[#D9D4C7] rounded-sm overflow-hidden">
      <div className="overflow-x-auto">
        <table className="w-full text-sm font-body" style={{ borderCollapse: 'collapse' }}>
          <thead>
            <tr className="bg-[#F1EDE4] text-[#0F1F1A]">
              <th className="text-left px-3 py-2 border-b border-r border-[#D9D4C7] text-xs font-semibold uppercase" style={{ letterSpacing: '0.04em', width: '22%' }}>Topic</th>
              <th className="text-left px-3 py-2 border-b border-r border-[#D9D4C7] text-xs font-semibold uppercase" style={{ letterSpacing: '0.04em', width: '13%' }}>Conclusion</th>
              <th className="text-left px-3 py-2 border-b border-r border-[#D9D4C7] text-xs font-semibold uppercase" style={{ letterSpacing: '0.04em', width: '18%' }}>Supporting documents</th>
              <th className="text-left px-3 py-2 border-b border-[#D9D4C7] text-xs font-semibold uppercase" style={{ letterSpacing: '0.04em' }}>Rationale</th>
            </tr>
          </thead>
          <tbody>
            {topics.map(t => {
              const ts = topicState[t.id] || {};
              const docs = getDocs(t.id);
              const text = ts.customText != null ? ts.customText : t.template(sensitivities, dev, docs);
              return (
                <tr key={t.id} className="border-b border-[#E8E4D8] align-top hover:bg-[#FBFAF7]">
                  <td className="px-3 py-3 border-r border-[#E8E4D8]">
                    <div className="font-display text-[15px] text-[#0F1F1A] leading-tight" style={{ fontWeight: 500 }}>{t.name}</div>
                    <div className="text-xs text-[#8B8472] italic mt-0.5">{t.category}</div>
                  </td>
                  <td className="px-3 py-3 border-r border-[#E8E4D8]">
                    <span className={`inline-block px-2 py-0.5 text-[10px] font-medium uppercase rounded-sm border ${ts.scopedIn ? 'bg-[#FCE7E2] text-[#8B2D1A] border-[#E5A89B]' : (t.conclusion.toLowerCase().includes('beneficial') ? 'bg-[#E8EDE8] text-[#2F4A3A] border-[#9FB5A4]' : 'bg-[#F1EDE4] text-[#6B6354] border-[#C7BFAB]')}`} style={{ letterSpacing: '0.05em' }}>{ts.scopedIn ? 'Scoped in' : t.conclusion}</span>
                  </td>
                  <td className="px-3 py-3 border-r border-[#E8E4D8] text-xs">
                    {docs.length === 0 ? <span className="text-[#8B8472] italic">— none —</span> : (
                      <ul className="list-disc pl-4 space-y-0.5">
                        {docs.map((d, i) => <li key={i}>{d}</li>)}
                      </ul>
                    )}
                  </td>
                  <td className="px-3 py-3 leading-relaxed">{renderPlaceholderText(text, dev)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}


const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(<App />);
</script>
</body>
</html>
